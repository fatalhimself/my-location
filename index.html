<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Coordinates</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #182230;
    --fg: #f2f4f7;
    --muted: #8b97a8;
    --gold: #c9a24a;
    --ok: #3fb67a;
    --err: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 22px; margin: 8px 0 0; }
  .status { color: var(--muted); font-size: 15px; min-height: 20px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    display: grid;
    gap: 14px;
  }
  .label {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .value {
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .small { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  button, a.btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 15px;
    border-radius: 12px;
    border: 0;
    cursor: pointer;
  }
  .primary { background: var(--gold); color: #1a1406; }
  .secondary { background: var(--card); color: var(--fg); border: 1px solid #2c3a4d; }
  button:disabled, a.btn.disabled { opacity: .4; pointer-events: none; }
  input {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #2c3a4d;
    background: var(--bg);
    color: var(--fg);
  }
</style>
</head>
<body>
<main>
  <h1>My Coordinates</h1>
  <div id="status" class="status">Tap "Get my location", then tap Allow.</div>

  <button id="get" class="primary">Get my location</button>

  <section class="card">
    <div>
      <div class="label">Latitude</div>
      <div id="lat" class="value">—</div>
    </div>
    <div>
      <div class="label">Longitude</div>
      <div id="lng" class="value">—</div>
    </div>
    <div id="acc" class="small"></div>
  </section>

  <button id="copy" class="secondary" disabled>Copy coordinates</button>

  <div>
    <div class="label" style="margin-bottom:6px">Send to (phone number)</div>
    <input id="phone" type="tel" placeholder="e.g. 9545551234" autocomplete="tel">
  </div>
  <a id="text" class="btn secondary disabled" href="#">Text it</a>
</main>

<script>
  const $ = id => document.getElementById(id);
  let coords = null;

  // Remember the phone number on this device
  try { $("phone").value = localStorage.getItem("sendTo") || ""; } catch (e) {}
  $("phone").addEventListener("input", () => {
    try { localStorage.setItem("sendTo", $("phone").value); } catch (e) {}
    updateTextLink();
  });

  function message() {
    if (!coords) return "";
    return `My location: ${coords.lat}, ${coords.lng}\nhttps://maps.apple.com/?ll=${coords.lat},${coords.lng}`;
  }

  function updateTextLink() {
    const link = $("text");
    if (!coords) { link.classList.add("disabled"); return; }
    const num = $("phone").value.replace(/[^\d+]/g, "");
    // iOS format: sms:NUMBER&body=TEXT
    link.href = `sms:${num}&body=${encodeURIComponent(message())}`;
    link.classList.remove("disabled");
  }

  function setStatus(text, kind) {
    const s = $("status");
    s.textContent = text;
    s.className = "status" + (kind ? " " + kind : "");
  }

  $("get").addEventListener("click", () => {
    if (!("geolocation" in navigator)) {
      setStatus("This browser can't share location.", "err");
      return;
    }
    setStatus("Finding you…");
    navigator.geolocation.getCurrentPosition(
      pos => {
        coords = {
          lat: pos.coords.latitude.toFixed(6),
          lng: pos.coords.longitude.toFixed(6)
        };
        $("lat").textContent = coords.lat;
        $("lng").textContent = coords.lng;
        $("acc").textContent = `Accurate to about ${Math.round(pos.coords.accuracy)} m · ${new Date().toLocaleTimeString()}`;
        $("copy").disabled = false;
        updateTextLink();
        setStatus("Location found.", "ok");
      },
      err => {
        const msg = {
          1: "Location is blocked. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using.",
          2: "Couldn't find your position. Try again outside or near a window.",
          3: "Took too long. Tap the button again."
        }[err.code] || "Something went wrong. Try again.";
        setStatus(msg, "err");
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });

  // Find the location automatically as soon as the page opens
  window.addEventListener("load", () => $("get").click());

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(message());
      setStatus("Copied.", "ok");
    } catch (e) {
      setStatus(`${coords.lat}, ${coords.lng} (select and copy it)`, "");
    }
  });
</script>
</body>
</html>
